apiVersion: batch/v1
kind: Job
metadata:
  name: user-seed
  namespace: hm-sec
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: user-seed
        hmsec.network/zone: app
    spec:
      restartPolicy: Never
      serviceAccountName: hm-sec-app
      automountServiceAccountToken: false
      containers:
        - name: user-seed
          image: hm-sec/user-service:k8s-v1
          imagePullPolicy: IfNotPresent
          env:
            - name: HMSEC_POSTGRES_USER
              valueFrom: {secretKeyRef: {name: hm-sec-db-secrets, key: HMSEC_POSTGRES_USER}}
            - name: HMSEC_POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: hm-sec-db-secrets, key: HMSEC_POSTGRES_PASSWORD}}
            - name: HMSEC_POSTGRES_DB
              valueFrom: {secretKeyRef: {name: hm-sec-db-secrets, key: HMSEC_POSTGRES_DB}}
            - name: POSTGRES_URI
              value: postgresql://$(HMSEC_POSTGRES_USER):$(HMSEC_POSTGRES_PASSWORD)@postgres:5432/$(HMSEC_POSTGRES_DB)?schema=user_service
            - name: DATABASE_URL
              value: postgresql://$(HMSEC_POSTGRES_USER):$(HMSEC_POSTGRES_PASSWORD)@postgres:5432/$(HMSEC_POSTGRES_DB)?schema=user_service
            - name: HMSEC_SEED_EMAIL
              valueFrom: {secretKeyRef: {name: hm-sec-seed-secrets, key: HMSEC_SEED_EMAIL}}
            - name: HMSEC_SEED_PASSWORD
              valueFrom: {secretKeyRef: {name: hm-sec-seed-secrets, key: HMSEC_SEED_PASSWORD}}
            - name: HMSEC_SEED_FIRST_NAME
              valueFrom: {secretKeyRef: {name: hm-sec-seed-secrets, key: HMSEC_SEED_FIRST_NAME}}
            - name: HMSEC_SEED_LAST_NAME
              valueFrom: {secretKeyRef: {name: hm-sec-seed-secrets, key: HMSEC_SEED_LAST_NAME}}
          command: ["npx", "tsx", "scripts/seed-hmsec-user.ts"]
