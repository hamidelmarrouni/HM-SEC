map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /hmsec-frontend-health {
        default_type application/json;
        return 200 '{"status":"ok","component":"frontend"}';
    }

    client_max_body_size 110m;

    # Serve API, sockets and media from the browser's own host and port.
    # Docker DNS is resolved per request so gateway recreation is safe.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://nginx-gateway:8080;
    location ~ ^/(api/|media/|hmsec-health$) {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite/React is a client-side SPA; unknown application paths must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
