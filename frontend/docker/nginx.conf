server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /hmsec-frontend-health {
        default_type application/json;
        return 200 '{"status":"ok","component":"frontend"}';
    }

    # Vite/React is a client-side SPA; unknown application paths must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
