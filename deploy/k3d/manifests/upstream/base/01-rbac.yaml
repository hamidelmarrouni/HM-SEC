apiVersion: v1
kind: ServiceAccount
metadata:
  name: hm-sec-app
  namespace: hm-sec
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hm-sec-ops-reader
  namespace: hm-sec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hm-sec-ops-readonly
  namespace: hm-sec
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hm-sec-ops-readonly
  namespace: hm-sec
subjects:
  - kind: ServiceAccount
    name: hm-sec-ops-reader
    namespace: hm-sec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hm-sec-ops-readonly
