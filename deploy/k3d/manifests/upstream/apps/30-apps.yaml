        app.kubernetes.io/name: reward-service
        app.kubernetes.io/part-of: hm-sec
        hmsec.network/zone: app
    spec:
      serviceAccountName: hm-sec-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - echo "[wait] postgres:5432"; until nc -z postgres 5432; do sleep 2; done;
          echo "[wait] kafka:9092"; until nc -z kafka 9092; do sleep 2; done; echo
          "[wait] query-service:3009"; until nc -z query-service 3009; do sleep 2;
          done
      containers:
      - name: reward-service
        image: hm-sec/reward-service:k8s-v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3008
          name: http
        envFrom:
        - configMapRef:
            name: hm-sec-config
        - secretRef:
            name: hm-sec-app-secrets
        env:
        - name: PORT
          value: '3008'
        - name: KAFKA_CLIENT_ID
          value: hmsec-reward-service
        - name: HMSEC_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: hm-sec-db-secrets
              key: HMSEC_POSTGRES_USER
        - name: HMSEC_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hm-sec-db-secrets
              key: HMSEC_POSTGRES_PASSWORD
        - name: HMSEC_POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: hm-sec-db-secrets
              key: HMSEC_POSTGRES_DB
        - name: POSTGRES_URI
          value: postgresql://$(HMSEC_POSTGRES_USER):$(HMSEC_POSTGRES_PASSWORD)@postgres:5432/$(HMSEC_POSTGRES_DB)?schema=reward_service
        - name: DATABASE_URL
          value: postgresql://$(HMSEC_POSTGRES_USER):$(HMSEC_POSTGRES_PASSWORD)@postgres:5432/$(HMSEC_POSTGRES_DB)?schema=reward_service
        startupProbe:
          httpGet:
            path: /api/v1/reward/health
            port: http
          periodSeconds: 3
          failureThreshold: 40
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /api/v1/reward/health
            port: http
          periodSeconds: 5
          failureThreshold: 6
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /api/v1/reward/health
            port: http
          periodSeconds: 15
          failureThreshold: 4
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: hm-sec
  labels:
    app.kubernetes.io/name: media-service
    app.kubernetes.io/part-of: hm-sec
spec:
  type: ClusterIP
  selector:
    app: media-service
  ports:
  - name: http
    port: 3010
    targetPort: 3010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: hm-sec
  labels:
    app.kubernetes.io/name: media-service
    app.kubernetes.io/part-of: hm-sec
    hmsec.network/zone: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
        app.kubernetes.io/name: media-service
        app.kubernetes.io/part-of: hm-sec
        hmsec.network/zone: app
    spec:
      serviceAccountName: hm-sec-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers: []
      containers:
      - name: media-service
        image: hm-sec/media-service:k8s-v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3010
          name: http
        envFrom:
        - configMapRef:
            name: hm-sec-config
        env:
        - name: PORT
          value: '3010'
        - name: HMSEC_MEDIA_DIR
          value: /data/media
        startupProbe:
          httpGet:
            path: /api/v1/media/health
            port: http
          periodSeconds: 3
          failureThreshold: 40
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /api/v1/media/health
            port: http
          periodSeconds: 5
          failureThreshold: 6
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /api/v1/media/health
            port: http
          periodSeconds: 15
          failureThreshold: 4
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: media
          mountPath: /data/media
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: hm-sec-media
