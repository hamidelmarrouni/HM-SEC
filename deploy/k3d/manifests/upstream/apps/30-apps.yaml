apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: hm-sec
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: hm-sec
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
  - name: http
    port: 3001
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: hm-sec
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: hm-sec
    hmsec.network/zone: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: hm-sec
        hmsec.network/zone: app
    spec:
      serviceAccountName: hm-sec-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - echo "[wait] postgres:5432"; until nc -z postgres 5432; do sleep 2; done;
          echo "[wait] kafka:9092"; until nc -z kafka 9092; do sleep 2; done
      containers:
      - name: user-service
        image: hm-sec/user-service:k8s-v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
        envFrom:
        - configMapRef:
            name: hm-sec-config
        - secretRef:
            name: hm-sec-app-secrets
        env:
        - name: PORT
          value: '3001'
        - name: KAFKA_CLIENT_ID
          value: hmsec-user-service
        - name: HMSEC_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: hm-sec-db-secrets
              key: HMSEC_POSTGRES_USER
        - name: HMSEC_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hm-sec-db-secrets
              key: HMSEC_POSTGRES_PASSWORD
        - name: HMSEC_POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: hm-sec-db-secrets
              key: HMSEC_POSTGRES_DB
        - name: POSTGRES_URI
          value: postgresql://$(HMSEC_POSTGRES_USER):$(HMSEC_POSTGRES_PASSWORD)@postgres:5432/$(HMSEC_POSTGRES_DB)?schema=user_service
        - name: DATABASE_URL
          value: postgresql://$(HMSEC_POSTGRES_USER):$(HMSEC_POSTGRES_PASSWORD)@postgres:5432/$(HMSEC_POSTGRES_DB)?schema=user_service
        startupProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 3
          failureThreshold: 40
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 5
          failureThreshold: 6
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 15
          failureThreshold: 4
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
