apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hm-sec-media
  namespace: hm-sec
  labels:
    app.kubernetes.io/name: media-storage
    app.kubernetes.io/part-of: hm-sec
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
