map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 110m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /api/v1/query/ {
        proxy_pass http://query-service:3009;
    }

    location ^~ /api/v1/user/ {
        proxy_pass http://user-service:3001;
    }

    location ^~ /api/v1/admin/ {
        proxy_pass http://user-service:3001;
    }

    location ^~ /api/v1/global/ {
        proxy_pass http://user-service:3001;
    }

    location ^~ /api/v1/post {
        proxy_pass http://writer-service:3002;
    }

    location ^~ /api/v1/writer/ {
        proxy_pass http://writer-service:3002;
    }

    location ^~ /api/v1/feed/ {
        proxy_pass http://feed-service:3003;
    }

    location ^~ /api/v1/chat/ {
        proxy_pass http://chat-service:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/v1/notification/ {
        proxy_pass http://notification-service:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/v1/reward/ {
        proxy_pass http://reward-service:3008;
    }

    location ^~ /api/v1/media/ {
        proxy_pass http://media-service:3010;
    }

    location ^~ /media/ {
        proxy_pass http://media-service:3010;
    }

    location = /hmsec-health {
        default_type application/json;
        return 200 '{"status":"ok","project":"HM_SEC","gateway":"docker"}';
    }
}
