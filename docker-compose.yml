name: hm-sec

x-common-app-environment: &common-app-environment
  NODE_ENV: development
  FRONTEND_URL: "http://${HMSEC_PUBLIC_HOST:-127.0.0.1}:5173"
  accessTokenSecret: "${HMSEC_ACCESS_SECRET:?HMSEC_ACCESS_SECRET_required}"
  refreshTokenSecret: "${HMSEC_REFRESH_SECRET:?HMSEC_REFRESH_SECRET_required}"
  resetPasswordTokenSecret: "${HMSEC_RESET_SECRET:?HMSEC_RESET_SECRET_required}"
  otpTokenSecret: "${HMSEC_OTP_SECRET:?HMSEC_OTP_SECRET_required}"
  HMSEC_DEV_FIXED_OTP: "123456"
  passwordSalt: "10"
  otpSalt: "5"
  KAFKA_BROKER: "kafka:9092"
  KAFKA_BROKER_URI: "kafka:9092"
  KAFKAJS_NO_PARTITIONER_WARNING: "1"
  ELASTICSEARCH_PROXY_BASE_URL: "http://query-service:3009"
  USER_SERVICE_BASE_URL: "http://user-service:3001"
  AWS_ACCESS_KEY: "hmsec-local"
  AWS_SECRET_KEY: "hmsec-local-secret"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET_NAME: "hm-sec-media"
  AWS_CLOUDFRONT_DISTRIBUTION_DOMAIN_NAME: "/media"
  HMSEC_LOCAL_MEDIA_UPLOAD_BASE_URL: ""
  HMSEC_LOCAL_MEDIA_PUBLIC_BASE_URL: "/media"
  GOOGLE_CLIENT_ID: "hmsec-local-disabled"
  GOOGLE_CLIENT_SECRET: "hmsec-local-disabled"
  SMTP_HOST: "127.0.0.1"
  SMTP_PORT: "1025"
  SMTP_SERVICE: ""
  SMTP_MAIL: "hmsec@local.test"
  SMTP_PASSWORD: ""
  SMTP_AUTH: "false"
  HMSEC_EMAIL_CONSOLE: "true"
  FEED_CACHE_SIZE: "100"
  CHAT_REWARED_COOLOFF_INTERFVAL: "86400000"
  HMSEC_DEV_AUTO_APPROVE: "true"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${HMSEC_POSTGRES_USER:?HMSEC_POSTGRES_USER_required}"
      POSTGRES_PASSWORD: "${HMSEC_POSTGRES_PASSWORD:?HMSEC_POSTGRES_PASSWORD_required}"
      POSTGRES_DB: "${HMSEC_POSTGRES_DB:?HMSEC_POSTGRES_DB_required}"
    volumes:
      - hm-sec-postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HMSEC_POSTGRES_USER} -d ${HMSEC_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres-init:
    image: postgres:16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${HMSEC_POSTGRES_PASSWORD:?HMSEC_POSTGRES_PASSWORD_required}"
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 \
          -h postgres \
          -U "${HMSEC_POSTGRES_USER}" \
          -d "${HMSEC_POSTGRES_DB}" \
          -c 'CREATE SCHEMA IF NOT EXISTS user_service; CREATE SCHEMA IF NOT EXISTS reward_service;'
    networks:
      - data

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - hm-sec-mongo-data:/data/db
    networks:
      data:
        aliases:
          - mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongodb-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./docker/init/mongo-init.sh:/docker-init/mongo-init.sh:ro
    command: ["/bin/sh", "/docker-init/mongo-init.sh"]
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hm-sec-redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data/kafka-logs"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - hm-sec-kafka-data:/var/lib/kafka/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/init/kafka-init.sh:/docker-init/kafka-init.sh:ro
    command: ["/bin/sh", "/docker-init/kafka-init.sh"]
    networks:
      - data

  user-db-init:
    image: hm-sec/user-service:docker-v1
    build:
      context: ./user-service
    restart: "no"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_URI: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=user_service"
      DATABASE_URL: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=user_service"
    command: ["npx", "prisma", "db", "push", "--schema", "prisma/schema.prisma"]
    healthcheck:
      disable: true
    networks:
      - data

  reward-db-init:
    image: hm-sec/reward-service:docker-v1
    build:
      context: ./reward-service
    restart: "no"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_URI: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=reward_service"
      DATABASE_URL: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=reward_service"
    command: ["npx", "prisma", "db", "push", "--schema", "prisma/schema.prisma"]
    healthcheck:
      disable: true
    networks:
      - data

  user-seed:
    image: hm-sec/user-service:docker-v1
    restart: "no"
    depends_on:
      user-db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_URI: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=user_service"
      DATABASE_URL: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=user_service"
      HMSEC_SEED_EMAIL: "${HMSEC_SEED_EMAIL:-demo@example.test}"
      HMSEC_SEED_PASSWORD: "${HMSEC_SEED_PASSWORD:?HMSEC_SEED_PASSWORD_required}"
      HMSEC_SEED_FIRST_NAME: "${HMSEC_SEED_FIRST_NAME:-Demo}"
      HMSEC_SEED_LAST_NAME: "${HMSEC_SEED_LAST_NAME:-User}"
    command: ["npx", "tsx", "scripts/seed-hmsec-user.ts"]
    healthcheck:
      disable: true
    networks:
      - data

  reward-score-init:
    image: postgres:16
    restart: "no"
    depends_on:
      reward-db-init:
        condition: service_completed_successfully
      user-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: "${HMSEC_POSTGRES_PASSWORD:?HMSEC_POSTGRES_PASSWORD_required}"
      HMSEC_SEED_EMAIL: "${HMSEC_SEED_EMAIL:-demo@example.test}"
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 \
          -h postgres \
          -U "${HMSEC_POSTGRES_USER}" \
          -d "${HMSEC_POSTGRES_DB}" \
          -v main_email="$$HMSEC_SEED_EMAIL" <<'SQL'
        INSERT INTO reward_service."HumaneScore" ("userId", "score")
        SELECT id, 0
        FROM user_service."User"
        WHERE email IN (:'main_email', 'brahim@example.test', 'meryam@example.test', 'ihssan@example.test')
        ON CONFLICT ("userId") DO NOTHING;
        SQL
    networks:
      - data

  user-service:
    image: hm-sec/user-service:docker-v1
    build:
      context: ./user-service
    restart: unless-stopped
    init: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      user-seed:
        condition: service_completed_successfully
    environment:
      <<: *common-app-environment
      PORT: "3001"
      KAFKA_CLIENT_ID: "hmsec-user-service"
      POSTGRES_URI: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=user_service"
      DATABASE_URL: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=user_service"
    networks:
      - app
      - data

  writer-service:
    image: hm-sec/writer-service:docker-v1
    build:
      context: ./writer-service
    restart: unless-stopped
    init: true
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *common-app-environment
      PORT: "3002"
      KAFKA_CLIENT_ID: "hmsec-writer-service"
      MONGODB_URI: "mongodb://mongodb:27017/hm_sec_writer?replicaSet=rs0"
    networks:
      - app
      - data

  query-service:
    image: hm-sec/query-service:docker-v1
    build:
      context: ./query-service
    restart: unless-stopped
    init: true
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      user-service:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3009"
      FRONTEND_URL: "http://${HMSEC_PUBLIC_HOST:-127.0.0.1}:5173"
      MONGODB_URI: "mongodb://mongodb:27017/hm_sec_writer?replicaSet=rs0"
      USER_SERVICE_BASE_URL: "http://user-service:3001"
      AWS_CLOUDFRONT_DISTRIBUTION_DOMAIN_NAME: "/media"
    networks:
      - app
      - data

  feed-service:
    image: hm-sec/feed-service:docker-v1
    build:
      context: ./feed-service
    restart: unless-stopped
    init: true
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      query-service:
        condition: service_healthy
    environment:
      <<: *common-app-environment
      PORT: "3003"
      KAFKA_CLIENT_ID: "hmsec-feed-service"
      MONGODB_URI: "mongodb://mongodb:27017/hm_sec_feed?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379/0"
    networks:
      - app
      - data

  chat-service:
    image: hm-sec/chat-service:docker-v1
    build:
      context: ./chat-service
    restart: unless-stopped
    init: true
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      query-service:
        condition: service_healthy
    environment:
      <<: *common-app-environment
      PORT: "3004"
      KAFKA_CLIENT_ID: "hmsec-chat-service"
      MONGODB_URI: "mongodb://mongodb:27017/hm_sec_chat?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379/1"
    networks:
      - app
      - data

  notification-service:
    image: hm-sec/notification-service:docker-v1
    build:
      context: ./notification-service
    restart: unless-stopped
    init: true
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      query-service:
        condition: service_healthy
    environment:
      <<: *common-app-environment
      PORT: "3005"
      KAFKA_CLIENT_ID: "hmsec-notification-service"
      MONGODB_URI: "mongodb://mongodb:27017/hm_sec_notification?replicaSet=rs0"
    networks:
      - app
      - data

  email-service:
    image: hm-sec/email-service:docker-v1
    build:
      context: ./email-service
    restart: unless-stopped
    init: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *common-app-environment
      PORT: "3006"
      KAFKA_CLIENT_ID: "hmsec-email-service"
    networks:
      - app
      - data

  moderation-service:
    image: hm-sec/moderation-service:docker-v1
    build:
      context: ./moderation-service
    restart: unless-stopped
    init: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *common-app-environment
      PORT: "3007"
      KAFKA_CLIENT_ID: "hmsec-moderation-service"
      HMSEC_DEV_AUTO_APPROVE: "true"
    networks:
      - app
      - data

  reward-service:
    image: hm-sec/reward-service:docker-v1
    build:
      context: ./reward-service
    restart: unless-stopped
    init: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      reward-score-init:
        condition: service_completed_successfully
      query-service:
        condition: service_healthy
    environment:
      <<: *common-app-environment
      PORT: "3008"
      KAFKA_CLIENT_ID: "hmsec-reward-service"
      POSTGRES_URI: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=reward_service"
      DATABASE_URL: "postgresql://${HMSEC_POSTGRES_USER}:${HMSEC_POSTGRES_PASSWORD}@postgres:5432/${HMSEC_POSTGRES_DB}?schema=reward_service"
    networks:
      - app
      - data

  media-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ./runtime/media:/source:ro
      - hm-sec-media-data:/data/media
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/media
        if [ -d /source ]; then cp -a /source/. /data/media/ 2>/dev/null || true; fi
        echo "[media-init] persistent media volume ready"
    networks:
      - app

  media-service:
    image: hm-sec/media-service:docker-v1
    build:
      context: ./media-service
    restart: unless-stopped
    init: true
    depends_on:
      media-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: "3010"
      FRONTEND_URL: "http://${HMSEC_PUBLIC_HOST:-127.0.0.1}:5173"
      HMSEC_MEDIA_DIR: "/data/media"
    volumes:
      - hm-sec-media-data:/data/media
    networks:
      - app

  nginx-gateway:
    image: hm-sec/nginx-gateway:docker-v1
    build:
      context: ./docker/nginx
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      writer-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reward-service:
        condition: service_healthy
      query-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      email-service:
        condition: service_healthy
      moderation-service:
        condition: service_healthy
    ports:
      - "${HMSEC_API_BIND:-127.0.0.1}:8080:8080"
    networks:
      - edge
      - app

  frontend:
    image: hm-sec/frontend:docker-v1
    build:
      context: ./frontend
      args:
        VITE_BACKEND_BASE_URL: "__HMSEC_BACKEND_BASE_URL__"
        VITE_FRONTEND_BASE_URL: "__HMSEC_FRONTEND_BASE_URL__"
        VITE_GOOGLE_CLIENT_ID: ""
    restart: unless-stopped
    depends_on:
      nginx-gateway:
        condition: service_healthy
    environment:
      VITE_BACKEND_BASE_URL: "auto"
      VITE_FRONTEND_BASE_URL: "auto"
    ports:
      - "${HMSEC_FRONTEND_BIND:-0.0.0.0}:5173:5173"
    networks:
      - edge

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  hm-sec-postgres-data: {}
  hm-sec-mongo-data: {}
  hm-sec-redis-data: {}
  hm-sec-kafka-data: {}
  hm-sec-media-data: {}
