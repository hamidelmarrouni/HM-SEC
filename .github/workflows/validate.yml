name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -v
      - run: python scripts/hmsec.py check
      - run: python -m unittest discover -s deploy/k3d/tests -v
      - name: Shell syntax
        run: find docker frontend/docker deploy/k3d -name '*.sh' -exec bash -n {} \;
