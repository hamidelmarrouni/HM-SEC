name: Full Docker integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/hmsec.py up
      - run: python scripts/hmsec.py test
      - if: always()
        run: python scripts/hmsec.py status
      - if: always()
        run: python scripts/hmsec.py down
